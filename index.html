<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дневник тренировок</title>
<meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121820" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Дневник">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#18222E; --muted:#5E6B7A; --line:#D5DBE2;
  --accent:#2F5BEA; --accent-ink:#FFFFFF; --protein:#D9951C; --danger:#C8423B; --soft:#E3E8EE;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --text:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121820; --surface:#1B232D; --ink:#E6EBF1; --muted:#93A0AF; --line:#2B3542;
    --accent:#6E8DFF; --accent-ink:#0E1420; --protein:#F0B447; --danger:#EF6B63; --soft:#232D39;
  }
}
:root[data-theme="dark"]{
  --bg:#121820; --surface:#1B232D; --ink:#E6EBF1; --muted:#93A0AF; --line:#2B3542;
  --accent:#6E8DFF; --accent-ink:#0E1420; --protein:#F0B447; --danger:#EF6B63; --soft:#232D39;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:20px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.top h1{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:-.01em;margin:0}
#sync{font-size:.8rem;color:var(--muted);text-align:right}
h2{font-family:var(--display);font-weight:500;font-size:1rem;margin:28px 0 12px}
h3{margin:0;font-size:1.05rem;font-weight:600}
.big{font-family:var(--display);font-weight:700;font-size:clamp(2rem,9vw,2.8rem);line-height:1;letter-spacing:-.02em;display:block}
.cap{display:block;color:var(--muted);font-size:.85rem;margin-top:6px}
.muted{color:var(--muted)}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:4px 0 22px;border-bottom:1px solid var(--line);margin-bottom:20px}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:13px 18px;font-weight:600}
.primary:active{transform:translateY(1px)}
.wide{width:100%}
.ghost{background:transparent;border:1px solid var(--line);border-radius:12px;padding:13px 18px}
.icon{background:transparent;border:0;width:36px;height:36px;border-radius:10px;font-size:1.3rem;line-height:1;color:var(--muted);display:inline-grid;place-items:center}
.icon:hover{background:var(--soft)}
.icon:disabled{opacity:.3;cursor:default}
.hist{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.hdate{display:block;font-weight:600;text-transform:capitalize}
.hex{display:block;margin-top:2px}
.hmeta{display:block;color:var(--muted);font-size:.85rem;margin-top:4px}
.empty{color:var(--muted);padding:18px 0}
.ed-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.ed-head h2{margin:0}
input[type=date],.field{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px 10px;margin-bottom:12px}
.ex header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.last{font-size:.85rem;color:var(--muted);margin:4px 0 10px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:.85rem}
.set-h,.set{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:8px;align-items:center}
.set-h{font-size:.75rem;color:var(--muted);margin-bottom:4px}
.set{margin-bottom:6px}
.set .n{font-family:var(--display);font-size:.85rem;color:var(--muted);text-align:center}
.set input{width:100%;background:var(--bg);border:1px solid transparent;border-radius:10px;padding:10px;font-size:1.05rem;font-weight:600;text-align:center}
.set input:focus{border-color:var(--accent);outline:none}
.set input::placeholder{color:var(--muted);opacity:.45;font-weight:400}
.add-set{background:none;border:1px dashed var(--line);border-radius:10px;width:100%;padding:9px;margin-top:4px;color:var(--muted)}
.add-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin:16px 0}
.ed-actions{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:20px}
.danger-link{background:none;border:0;color:var(--danger);margin:18px auto 0;display:block;padding:8px}
.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.daynav span{font-weight:600;text-transform:capitalize}
.ring-wrap{position:relative;width:min(240px,70vw);margin:0 auto}
.ring{width:100%;height:auto;display:block}
.ring .track{fill:none;stroke:var(--soft);stroke-width:10}
.ring .fill{fill:none;stroke:var(--protein);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring-text{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.left{text-align:center;margin:10px 0 22px;font-weight:500}
.done{color:var(--protein)}
.add-food{display:grid;grid-template-columns:1fr 92px auto;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:.88rem}
.chip b{color:var(--protein);font-weight:600;margin-left:4px}
.entries{list-style:none;margin:16px 0 0;padding:0}
.entries li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.entries li span:first-child{flex:1}
.entries .g{font-weight:600}
.bars{display:grid;grid-template-columns:repeat(var(--n,7),1fr);gap:8px;height:150px;align-items:end;position:relative;padding-bottom:22px}
.bar{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bar i{display:block;width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--soft)}
.bar.hit i{background:var(--protein)}
.bar.acc i{background:var(--accent)}
.bar small{position:absolute;bottom:-20px;font-size:.72rem;color:var(--muted)}
.bar em{font-style:normal;font-size:.7rem;color:var(--muted);margin-bottom:3px}
.goal-line{position:absolute;left:0;right:0;border-top:1.5px dashed var(--protein);opacity:.7;pointer-events:none}
.goal{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted)}
.goal input{width:90px;text-align:center}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:12px;padding:3px;gap:3px;margin:12px 0}
.seg button{background:transparent;border:0;border-radius:9px;padding:8px 4px;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600}
select.field{width:100%;padding:11px 10px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:10px;font-family:var(--text)}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.records{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.records .v{font-family:var(--display);font-weight:700;font-size:1.25rem;display:block}
.records .d{font-size:.75rem;color:var(--muted)}
.note{font-size:.8rem;color:var(--muted);margin-top:8px}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{background:none;border:0;padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;color:var(--muted)}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:600}
.tabbar svg{width:22px;height:22px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;transition:.25s;pointer-events:none;z-index:9;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.ghost:disabled,.primary:disabled{opacity:.4;cursor:default}
.seg2{grid-template-columns:1fr 1fr;margin:0 0 16px}
.clock{font-family:var(--display);font-weight:700;font-size:clamp(3rem,17vw,4.6rem);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;display:block;margin:10px 0}
.tb-display{border-radius:20px;padding:26px 16px;text-align:center;background:var(--surface);border:1px solid var(--line);transition:background .3s,color .3s}
.tb-display.work{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tb-display.rest{background:var(--protein);color:#1D1406;border-color:transparent}
.tb-display.prep{background:var(--soft)}
.tb-display.sw .clock{font-size:clamp(2.3rem,12.5vw,3.6rem)}
.tb-phase{display:block;font-weight:600;font-size:1.1rem}
.tb-round{display:block;font-size:.9rem;opacity:.8}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 20px}
.controls button{padding:15px;font-size:1.05rem}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 6px 8px 12px}
.stepper .cap{margin:0 0 2px}
.stepper b{font-size:1.1rem}
.laps{list-style:none;margin:0;padding:0}
.laps li{display:grid;grid-template-columns:1fr auto auto;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.laps .t{color:var(--muted)}
.kform{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.kform-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kform-row label{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
.kform .ed-actions{margin-top:4px}
.kstats{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:8px 0 10px}
.kbest{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1.1;display:block}
.kbest small{font-family:var(--text);font-weight:500;font-size:.9rem;color:var(--muted)}
.klast{text-align:right}
.klast .cap{margin:0}
.kgoal{display:grid;gap:5px;font-size:.85rem;color:var(--muted);margin-bottom:10px}
.kbar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.kbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.kgoal.reached{color:var(--accent);font-weight:600}
.kmeta{font-size:.82rem;color:var(--muted);margin:2px 0 0}
.kprog{margin:0 0 10px;font-weight:600}
.kprog span{font-weight:400;color:var(--muted);font-size:.85rem}
.kprog.good{color:var(--accent)}
.kprog.bad{color:var(--danger)}
.kform-row.two{grid-template-columns:1fr 1fr}
.klabel{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
.ksettings{display:grid;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.src{color:var(--accent);font-size:.75rem;margin-left:4px}
.ex .chart{margin-bottom:10px}
.spark{width:100%;height:44px;display:block;margin-bottom:10px}
.spark path{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.krow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) auto;gap:8px}
.krow .primary{padding:9px 12px}
details{margin-top:10px}
summary{cursor:pointer;color:var(--muted);font-size:.9rem;padding:4px 0}
.setrow{display:flex;gap:12px;align-items:flex-start;margin:14px 0;font-size:.95rem}
.setrow input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--accent);margin-top:1px}
.stack{display:grid;gap:10px;margin-top:12px}
.howto{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.9rem;margin-top:12px}
.howto ol{margin:6px 0 0;padding-left:20px}
.howto li{margin:4px 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><h1>Дневник</h1><button class="icon" id="gear" data-action="settings" aria-label="Настройки"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></header>
  <main id="main"></main>
</div>
<div class="tabbar"><nav>
  <button data-tab="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg>Тренировки</button>
  <button data-tab="protein"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 8 8h-8z" fill="currentColor" stroke="none"/></svg>Белок</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18l5-6 4 3 7-9"/><path d="M4 21h16"/></svg>Прогресс</button>
  <button data-tab="key"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>Ключевые</button>
  <button data-tab="timer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 2h4"/></svg>Таймер</button>
</nav></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const z = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
const today = () => ymd(new Date());
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtDate = (s, o = {weekday:'short', day:'numeric', month:'long'}) => parseYmd(s).toLocaleDateString('ru-RU', o);
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const fmt = n => (Math.round(n * 10) / 10).toLocaleString('ru-RU');
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c; };
const same = (a, b) => a.trim().toLowerCase() === b.trim().toLowerCase();

const KEY = 'workout-tracker-v1';
const blank = () => normalize({});
const UNITS = ['повт.', 'кг', 'сек', 'мин', 'км', 'м'];
function normalize(d) {
  if (!d || typeof d !== 'object') d = {};
  const p = d.protein || {};
  return {
    workouts: Array.isArray(d.workouts) ? d.workouts : [],
    protein: {goal: num(p.goal) || 120, log: (p.log && typeof p.log === 'object') ? p.log : {}, foods: Array.isArray(p.foods) ? p.foods : []},
    key: Array.isArray(d.key) ? d.key : [],
    tabata: Object.assign({work: 20, rest: 10, rounds: 8, prep: 10}, d.tabata || {}),
    settings: Object.assign({notes: 'share', shortcut: 'Дневник в Заметки', autoSend: false, lastBackup: null}, d.settings || {})
  };
}

let S = blank(), ref = null, tab = 'train', draft = null, proteinDay = today(), progEx = null, progMode = 'max', sync = 'local';
try { const r = localStorage.getItem(KEY); if (r) S = normalize(JSON.parse(r)); } catch (e) {}
try { const r = localStorage.getItem(KEY + '-draft'); if (r) draft = JSON.parse(r); } catch (e) {}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Не удалось сохранить: память браузера переполнена'); }
}
function saveDraft() { try { draft ? localStorage.setItem(KEY + '-draft', JSON.stringify(draft)) : localStorage.removeItem(KEY + '-draft'); } catch (e) {} }
function setSync() {}
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }
function armed(btn, label) {
  if (btn.dataset.armed) return true;
  const old = btn.textContent; btn.dataset.armed = '1'; btn.textContent = label;
  setTimeout(() => { if (btn.isConnected) { btn.textContent = old; delete btn.dataset.armed; } }, 3000);
  return false;
}

/* ---------- data helpers ---------- */
const setVol = s => num(s.w) * num(s.r);
const exVol = e => e.sets.reduce((a, s) => a + setVol(s), 0);
const wVol = w => w.exercises.reduce((a, e) => a + exVol(e), 0);
const wSets = w => w.exercises.reduce((a, e) => a + e.sets.length, 0);
const sorted = () => [...S.workouts].sort((a, b) => b.date.localeCompare(a.date));
function weekStart(d = new Date()) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }
function exerciseNames() {
  const m = new Map();
  sorted().forEach(w => w.exercises.forEach(e => { const k = e.name.trim().toLowerCase(); if (k && !m.has(k)) m.set(k, e.name.trim()); }));
  return [...m.values()];
}
function lastTime(name, excludeId) {
  for (const w of sorted()) {
    if (w.id === excludeId) continue;
    const e = w.exercises.find(e => same(e.name, name));
    if (e) return {date: w.date, sets: e.sets};
  }
  return null;
}
const dayProtein = d => (S.protein.log[d] || []).reduce((a, x) => a + num(x.g), 0);

/* ---------- views ---------- */
function render() {
  document.querySelectorAll('.tabbar button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  $('#main').innerHTML = tab === 'train' ? (draft ? viewEditor() : viewTrain()) : tab === 'protein' ? viewProtein()
    : tab === 'key' ? viewKey() : tab === 'timer' ? viewTimer() : tab === 'settings' ? viewSettings() : viewProgress();
  setSync(sync);
  if (tab === 'timer') updateTimerDOM();
}

function viewTrain() {
  const ws = ymd(weekStart());

function viewProgress() {
  const names = exerciseNames();
  if (!names.length) return `<h2>Прогресс</h2><p class="empty">Запишите пару тренировок, и здесь появятся графики по каждому упражнению и личные рекорды.</p>`;
  if (!progEx || !names.includes(progEx)) progEx = names[0];
  const pts = sorted().reverse().map(w => {
    const e = w.exercises.find(e => same(e.name, progEx)); if (!e || !e.sets.length) return null;
    return {date: w.date, max: Math.max(...e.sets.map(s => num(s.w))), e1: Math.max(...e.sets.map(s => num(s.w) * (1 + num(s.r) / 30))), vol: exVol(e)};
  }).filter(Boolean);
  const best = k => pts.reduce((a, p) => p[k] > a[k] ? p : a, pts[0]);
  const bm = best('max'), be = best('e1'), bv = best('vol');
  const weeks = [...Array(8)].map((_, k) => { const s = weekStart(); s.setDate(s.getDate() - 7 * (7 - k)); const e = new Date(s); e.setDate(e.getDate() + 7); return {s, n: S.workouts.filter(w => w.date >= ymd(s) && w.date < ymd(e)).length}; });
  const wTop = Math.max(3, ...weeks.map(w => w.n));
  const modes = [['max', 'Макс. вес'], ['e1', 'Расчётный 1ПМ'], ['vol', 'Объём']];
  return `
  <h2 style="margin-top:0">Упражнение</h2>

  <div class="seg" role="group" aria-label="Что показать">${modes.map(([k, l]) => `<button data-action="mode" data-m="${k}" aria-pressed="${progMode === k}">${l}</button>`).join('')}</div>
  ${lineChart(pts, progMode)}
  ${progMode === 'e1' ? '<p class="note">Расчётный 1ПМ — оценка веса, который вы подняли бы на один повтор (формула Эпли). Удобно сравнивать подходы с разным числом повторов.</p>' : ''}
  <div class="records">
    <div><span class="cap">Макс. вес</span><span class="v">${fmt(bm.max)}</span><span class="d">${fmtDate(bm.date, {day:'numeric', month:'short'})}</span></div>
    <div><span class="cap">1ПМ</span><span class="v">${fmt(be.e1)}</span><span class="d">${fmtDate(be.date, {day:'numeric', month:'short'})}</span></div>
    <div><span class="cap">Объём</span><span class="v">${Math.round(bv.vol).toLocaleString('ru-RU')}</span><span class="d">${fmtDate(bv.date, {day:'numeric', month:'short'})}</span></div>
  </div>
  <h2>Тренировок по неделям</h2>
  <div class="bars" style="--n:8">
    ${weeks.map(w => `<div class="bar acc"><em>${w.n || ''}</em><i style="height:${(w.n / wTop) * 100}%"></i>
      <small>${w.s.toLocaleDateString('ru-RU', {day:'numeric', month:'numeric'})}</small></div>`).join('')}
  </div>`;
}

function lineChart(pts, key) {
  if (pts.length < 2) return `<p class="empty">Нужно хотя бы две тренировки с этим упражнением, чтобы построить график.</p>`;
  const W = 340, H = 190, p = {l: 40, r: 12, t: 12, b: 26};
  const ys = pts.map(q => q[key]);
  let mn = Math.min(...ys), mx = Math.max(...ys);
  if (mn === mx) { mn -= 1; mx += 1; }
  const pad = (mx - mn) * 0.12; mn = Math.max(0, mn - pad); mx += pad;
  const x = i => p.l + (W - p.l - p.r) * (i / (pts.length - 1));
  const y = v => p.t + (H - p.t - p.b) * (1 - (v - mn) / (mx - mn));
  const path = pts.map((q, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(q[key]).toFixed(1)).join(' ');
  const ticks = [mn, (mn + mx) / 2, mx];
  const lab = v => key === 'vol' ? Math.round(v).toLocaleString('ru-RU') : fmt(v);
  const d = s => fmtDate(s, {day:'numeric', month:'short'});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="График прогресса">
    ${ticks.map(t => `<line class="grid" x1="${p.l}" x2="${W - p.r}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${p.l - 6}" y="${y(t) + 3}" text-anchor="end">${lab(t)}</text>`).join('')}
    <path class="line" d="${path}"/>
    ${pts.length <= 40 ? pts.map((q, i) => `<circle class="dot" cx="${x(i)}" cy="${y(q[key])}" r="3.5"><title>${d(q.date)}: ${lab(q[key])}</title></circle>`).join('') : ''}
    <text class="axis" x="${p.l}" y="${H - 6}">${d(pts[0].date)}</text>
    <text class="axis" x="${W - p.r}" y="${H - 6}" text-anchor="end">${d(pts[pts.length - 1].date)}</text>
  </svg>`;
}

/* ---------- key exercises ---------- */
let keyFormOpen = false;
const METRICS = {max: ['Макс. вес', 'кг'], reps: ['Макс. повторов в подходе', 'повт.'], e1: ['Расчётный 1ПМ', 'кг'], vol: ['Объём за тренировку', 'кг']};
function metricOf(e, m) {
  const st = e.sets; if (!st.length) return 0;
  if (m === 'reps') return Math.max(...st.map(x => num(x.r)));
  if (m === 'e1') return Math.max(...st.map(x => num(x.w) * (1 + num(x.r) / 30)));
  if (m === 'vol') return exVol(e);
  return Math.max(...st.map(x => num(x.w)));
}
// link: undefined = подобрать автоматически по названию, null = не связывать, {name, metric} = выбрано вручную
function kLink(k) {
  if (k.link === null) return null;
  if (k.link && k.link.name) return k.link;
  const n = exerciseNames().find(n => same(n, k.name)); if (!n) return null;
  return k.unit === 'кг' ? {name: n, metric: 'max'} : k.unit === 'повт.' ? {name: n, metric: 'reps'} : null;
}
const kUnit = k => { const l = kLink(k); return l ? METRICS[l.metric][1] : k.unit; };
function kResults(k) {
  const out = k.results.map(r => ({...r, src: 'manual'})), l = kLink(k);
  if (l) S.workouts.forEach(w => {
    const e = w.exercises.find(e => same(e.name, l.name));
    if (e && e.sets.length) { const v = metricOf(e, l.metric); if (v > 0) out.push({id: 'w' + w.id, date: w.date, v, src: 'workout'}); }
  });
  return out;
}
function keyBest(k) { const r = kResults(k); return r.length ? r.reduce((a, x) => (k.lower ? x.v < a.v : x.v > a.v) ? x : a) : null; }
const linkOptions = sel => `<option value="">Не брать</option>` + exerciseNames().map(n => `<option ${sel && same(sel, n) ? 'selected' : ''}>${esc(n)}</option>`).join('');
const metricOptions = sel => Object.entries(METRICS).map(([k, [l]]) => `<option value="${k}" ${sel === k ? 'selected' : ''}>${l}</option>`).join('');

function syncKForm() { const on = !!($('#kLinkSel') && $('#kLinkSel').value); ['#kUnit', '#kLower'].forEach(q => { const el = $(q); if (el) { el.disabled = on; el.closest('label').style.opacity = on ? .4 : 1; } }); }
function viewKey() {
  const hasW = exerciseNames().length > 0;
  const form = `<div class="kform">
    <input id="kName" class="field" placeholder="Название, например «Подтягивания»" autocomplete="off">
    ${hasW ? `<label class="klabel">Брать результаты из тренировок
      <div class="kform-row two"><select id="kLinkSel" class="field">${linkOptions()}</select><select id="kMetric" class="field">${metricOptions('max')}</select></div></label>` : ''}
    <div class="kform-row" id="kManualRow">
      <label>Единица<select id="kUnit" class="field">${UNITS.map(u => `<option>${u}</option>`).join('')}</select></label>

      <label>Цель<input id="kGoal" class="field" inputmode="decimal" placeholder="можно пусто"></label>
    </div>
    <div class="ed-actions"><button class="primary" data-action="k-create">Добавить</button><button class="ghost" data-action="k-form">Отменить</button></div>

  return `<h2 style="margin-top:0">Ключевые упражнения</h2>

  ${keyFormOpen ? form : '<button class="primary wide" data-action="k-form">Добавить упражнение</button>'}`;

function kCard(k) {
  const all = kResults(k), unit = esc(kUnit(k)), l = kLink(k);
  const best = keyBest(k), res = [...all].sort((a, b) => b.date.localeCompare(a.date)), last = res[0];
  const chron = [...all].sort((a, b) => a.date.localeCompare(b.date));
  let goal = '', prog = '';
  if (k.goal) {
    const reached = best && (k.lower ? best.v <= k.goal : best.v >= k.goal);
    const pct = !best ? 0 : Math.min(1, k.lower ? (best.v > 0 ? k.goal / best.v : 0) : best.v / k.goal);
    goal = `<div class="kgoal ${reached ? 'reached' : ''}"><div class="kbar"><i style="width:${pct * 100}%"></i></div>
      <span>${reached ? `Цель ${fmt(k.goal)} ${unit} достигнута` : `Цель: ${fmt(k.goal)} ${unit}, осталось ${fmt(Math.abs(k.goal - (best ? best.v : 0)))} ${unit}`}</span></div>`;
  }
  if (chron.length >= 2) {
    const f = chron[0], lr = chron[chron.length - 1], diff = lr.v - f.v, good = k.lower ? diff < 0 : diff > 0;
    const pc = f.v ? Math.round(diff / f.v * 100) : null, sg = diff > 0 ? '+' : diff < 0 ? '−' : '';
    prog = `<p class="kprog ${good ? 'good' : diff === 0 ? '' : 'bad'}">${diff === 0 ? 'Без изменений' : `${sg}${fmt(Math.abs(diff))} ${unit}${pc !== null ? ` (${sg}${Math.abs(pc)}%)` : ''}`}
      <span> с ${fmtDate(f.date, {day:'numeric', month:'short'})}, ${chron.length} ${plural(chron.length, 'замер', 'замера', 'замеров')}</span></p>`;
  }
  const chart = chron.length >= 2 ? lineChart(chron.map(r => ({date: r.date, v: r.v})), 'v') : '';
  return `<article class="ex">
    <header><h3>${esc(k.name)}</h3></header>
    ${l ? `<p class="kmeta">Из тренировок: «${esc(l.name)}», ${METRICS[l.metric][0].toLowerCase()}</p>` : ''}
    <div class="kstats">
      <div><span class="cap">Лучший результат</span><span class="kbest">${best ? fmt(best.v) : '—'}<small> ${unit}</small></span></div>
      ${last ? `<div class="klast"><span class="cap">Последний</span><b>${fmt(last.v)} ${unit}</b><span class="cap">${fmtDate(last.date, {day:'numeric', month:'short'})}</span></div>` : ''}
    </div>
    ${prog}${goal}${chart}
    ${!all.length && l ? '<p class="muted">Запишите это упражнение в тренировке, и результат появится здесь.</p>' : ''}
    <div class="krow">
      <input class="field" inputmode="decimal" data-kval="${esc(k.id)}" placeholder="Результат" aria-label="Результат, ${unit}">
      <input type="date" class="field" data-kdate="${esc(k.id)}" value="${today()}" max="${today()}" aria-label="Дата">
      <button class="primary" data-action="k-add" data-id="${esc(k.id)}">Записать</button>
    </div>
    <details><summary>История и настройки (${res.length})</summary>
      ${res.length ? `<ul class="entries">${res.map(r => `<li><span>${fmtDate(r.date, {day:'numeric', month:'long', year:'numeric'})}${r.src === 'workout' ? ' <small class="src">из тренировки</small>' : ''}</span><span class="g">${fmt(r.v)} ${unit}</span>
        ${r.src === 'manual' ? `<button class="icon" data-action="k-del-res" data-id="${esc(k.id)}" data-r="${esc(r.id)}" aria-label="Удалить результат">×</button>` : '<span class="icon"></span>'}</li>`).join('')}</ul>` : '<p class="muted">Пока нет результатов.</p>'}
      <div class="ksettings">
        ${exerciseNames().length ? `<label class="klabel">Брать результаты из тренировок
          <div class="kform-row two"><select class="field" data-klink="${esc(k.id)}">${linkOptions(l && l.name)}</select><select class="field" data-kmetric="${esc(k.id)}">${metricOptions(l ? l.metric : 'max')}</select></div></label>` : ''}
        <label class="klabel">Цель, ${unit}<input class="field" inputmode="decimal" data-kgoal="${esc(k.id)}" value="${k.goal || ''}" placeholder="без цели"></label>
        <button class="ghost" data-action="k-save" data-id="${esc(k.id)}">Сохранить настройки</button>
      </div>
      <button class="danger-link" data-action="k-delete" data-id="${esc(k.id)}">Удалить упражнение</button>
    </details>
  </article>`;
}

/* ---------- timers ---------- */
let timerMode = 'tabata', actx = null, wake = null;
const T = {phase: 'idle', round: 0, phaseEnd: 0, remaining: 0, running: false, lastSec: null};
const SW = {running: false, start: 0, acc: 0, laps: []};
function beep(freq = 880, dur = 0.12, vol = 0.25, delay = 0) {
  try {
    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
async function requestWake() { try { wake = await navigator.wakeLock?.request('screen'); } catch (e) {} }
function releaseWake() { try { wake?.release(); } catch (e) {} wake = null; }
const tcfg = () => S.tabata;
const phaseDur = p => (p === 'prep' ? tcfg().prep : p === 'work' ? tcfg().work : tcfg().rest) * 1000;
const tbTotal = () => { const c = tcfg(); return c.prep + c.rounds * c.work + (c.rounds - 1) * c.rest; };
function nextPhase() {
  const c = tcfg();
  if (T.phase === 'idle' || T.phase === 'done') { T.round = 1; T.phase = c.prep > 0 ? 'prep' : 'work'; }
  else if (T.phase === 'prep') T.phase = 'work';
  else if (T.phase === 'work') { if (T.round >= c.rounds) T.phase = 'done'; else if (c.rest > 0) T.phase = 'rest'; else T.round++; }

function updateTimerDOM() {

function tbToggle() {

}

}, 50);

const kgTxt = n => fmt(n);
function workoutText(w) {
  const lines = [`Тренировка, ${fmtDate(w.date, {weekday:'short', day:'numeric', month:'long', year:'numeric'})}`];
  w.exercises.forEach(e => lines.push(`${e.name}: ` + e.sets.map(s => num(s.w) ? `${kgTxt(num(s.w))}×${num(s.r)}` : `${num(s.r)} повт.`).join(', ')));
  lines.push(`Подходов: ${wSets(w)}, объём: ${Math.round(wVol(w)).toLocaleString('ru-RU')} кг`);
  const p = dayProtein(w.date); if (p) lines.push(`Белок за день: ${fmt(p)} из ${fmt(S.protein.goal)} г`);
  return lines.join('\n');
}
function weekText() {
  const ws = weekStart(), wsS = ymd(ws), list = sorted().filter(w => w.date >= wsS).reverse();
  const lines = [`Неделя с ${ws.toLocaleDateString('ru-RU', {day:'numeric', month:'long'})}`, ''];
  lines.push(`Тренировок: ${list.length}, объём: ${Math.round(list.reduce((a, w) => a + wVol(w), 0)).toLocaleString('ru-RU')} кг`);
  list.forEach(w => lines.push(`${fmtDate(w.date, {weekday:'short', day:'numeric'})}: ${w.exercises.map(e => e.name).join(', ')}`));
  const days = []; for (let d = new Date(ws); ymd(d) <= today(); d.setDate(d.getDate() + 1)) days.push(ymd(d));
  const withP = days.filter(d => dayProtein(d) > 0);
  if (withP.length) {
    const avg = withP.reduce((a, d) => a + dayProtein(d), 0) / withP.length;
    lines.push('', `Белок: в среднем ${fmt(Math.round(avg))} г в день (цель ${fmt(S.protein.goal)} г), цель выполнена ${withP.filter(d => dayProtein(d) >= S.protein.goal).length} из ${days.length} дн.`);
  }
  if (S.key.length) {
    lines.push('', 'Ключевые упражнения:');
    S.key.forEach(k => { const b = keyBest(k); lines.push(`${k.name}: лучший ${b ? fmt(b.v) + ' ' + kUnit(k) : 'нет данных'}${k.goal ? `, цель ${fmt(k.goal)} ${kUnit(k)}` : ''}`); });
  }
  return lines.join('\n');
}
async function copyText(text) {

}

async function backup() {
  const name = `dnevnik-${today()}.json`;
  const file = new File([JSON.stringify({app: 'dnevnik', version: 1, saved: new Date().toISOString(), data: S})], name, {type: 'application/json'});
  const done = () => { S.settings.lastBackup = today(); save(); render(); };
  if (navigator.canShare && navigator.canShare({files: [file]})) {

    catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;

}
function restoreFrom(file) {

      if (!d || (!Array.isArray(d.workouts) && !d.protein && !Array.isArray(d.key))) throw 0;
      const keep = S.settings; S = normalize(d); S.settings = Object.assign({}, keep, {lastBackup: keep.lastBackup});

function addExercise() {
  const inp = $('#newEx'), name = inp.value.trim();
  if (!name) { inp.focus(); return; }
  draft.exercises.push({name, sets: [{w: '', r: ''}]});
  saveDraft(); render();
  const all = document.querySelectorAll('.ex'); const last = all[all.length - 1];
  if (last) { last.scrollIntoView({block: 'center'}); last.querySelector('input')?.focus(); }
}
function addFood(name, g) {
  g = num(g);
  if (g <= 0) { toast('Укажите, сколько граммов белка'); $('#foodG')?.focus(); return; }
  name = (name || '').trim() || 'Без названия';
  (S.protein.log[proteinDay] ||= []).push({id: uid(), name, g});
  if (name !== 'Без названия') {
    const f = S.protein.foods.find(f => same(f.name, name));
    if (f) { f.g = g; f.n = (f.n || 0) + 1; } else S.protein.foods.push({name, g, n: 1});
    if (S.protein.foods.length > 80) S.protein.foods = S.protein.foods.sort((a, b) => (b.n || 0) - (a.n || 0)).slice(0, 80);
  }
  save(); render(); toast(`+${fmt(g)} г белка`);
}

document.addEventListener('click', e => {

    case 'del-ex': draft.exercises.splice(i, 1); saveDraft(); render(); break;
    case 'add-set': { const s = draft.exercises[i].sets, prev = s[s.length - 1]; s.push({w: prev ? prev.w : '', r: prev ? prev.r : ''}); saveDraft(); render(); break; }

      if (!ex.length) { toast('Добавьте хотя бы один подход с повторами'); return; }

  else if (t.id === 'kLinkSel') syncKForm();
  else if (t.id === 'autoSend') { S.settings.autoSend = t.checked; save(); }
  else if (t.id === 'shortcutName') { S.settings.shortcut = t.value.trim() || 'Дневник в Заметки'; save(); }
  else if (t.id === 'restoreFile' && t.files[0]) restoreFrom(t.files[0]);
  else if (t.id === 'progEx') { progEx = t.value; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'newEx') { e.preventDefault(); addExercise(); }
  else if (e.target.id === 'foodName' || e.target.id === 'foodG') { e.preventDefault(); addFood($('#foodName').value, $('#foodG').value); }
});

render();

/* ---------- offline ---------- */
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
</script>
</body>
